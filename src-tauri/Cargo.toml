[package]
name = "vibe-ssh"
version = "0.0.1"
description = "Vibe SSH — terminal, SFTP & tunnel workbench"
edition = "2021"
rust-version = "1.82"

[lib]
name = "vibe_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
dirs = "6"
bytes = "1"

tokio = { version = "1", features = [
  "rt-multi-thread", "macros", "io-util", "net", "sync", "time", "fs", "process",
] }

russh = { version = "0.54.5", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
portable-pty = "0.9"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
serialport = "4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
serialport = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
